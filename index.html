:root{color-scheme:dark;--bg:#0b1426;--card:#121d35;--ln:#223256;--g:#FFE600;--ok:#2AF598;--sl:#ffffff;--y:#fff59d;--tx:#e8eefc;--mu:#8fa0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 80% 0,#13264a,var(--bg) 60%);color:var(--tx);font:300 15px Poppins,Inter,sans-serif;min-height:100vh}
h1,h2,h3,b,th{font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.cover{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;min-height:90vh}
@media(max-width:800px){.cover{grid-template-columns:1fr}}
.cover img{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:16px;border:1px solid var(--ln);box-shadow:0 0 40px #ffe60022}
.cover .ph{aspect-ratio:3/1;border-radius:16px;background:var(--card)}
h1{font-size:clamp(26px,4vw,40px);margin:0;line-height:1.15}
.sub{color:var(--g);letter-spacing:.35em;font-weight:700;margin:8px 0 22px;text-align:right}
/* ===== judul login: simetris & rata tengah ===== */
.cover>div:last-child{width:100%;max-width:560px;justify-self:center}
.lt{text-align:center;margin-bottom:22px}
.lt h1{font-size:clamp(26px,4.2vw,44px);line-height:1.12;letter-spacing:.01em;text-wrap:balance}
.lt h1{background:linear-gradient(135deg,#fff9c4 0%,#fff176 30%,#ffe600 55%,#ffb300 80%,#ffd54f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px #ffe600aa) drop-shadow(0 0 26px #ffb30088);animation:glowU 3s ease-in-out infinite alternate}
@keyframes glowU{from{filter:drop-shadow(0 0 7px #ffe60088) drop-shadow(0 0 18px #ffb30066)}to{filter:drop-shadow(0 0 14px #fff176cc) drop-shadow(0 0 34px #ffe600aa)}}
@media(prefers-reduced-motion:reduce){.lt h1{animation:none}}
.lt h1 span{display:block}
.lt .sub{margin:12px 0 0;text-align:center;font-size:clamp(10px,1.45vw,14px);letter-spacing:.5em;padding-left:.5em;white-space:nowrap}
.lt .sub::after{content:"";display:block;width:56px;height:3px;border-radius:3px;background:var(--g);margin:14px auto 0;opacity:.8}
.cr{text-align:center;margin-top:18px;font-size:12px;letter-spacing:.04em;color:var(--mu)}
.cr::before{content:"";display:block;width:40px;height:1px;background:var(--ln);margin:0 auto 12px}
.cover .card{margin:0}
@media(max-width:800px){.cover{min-height:auto;padding-top:28px}.cover img{max-width:420px;margin:0 auto;display:block}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;margin:14px 0}
input,select{width:100%;padding:12px 14px;margin:6px 0 12px;background:#0c1730;border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #ffe60033}
label{font-size:12px;color:var(--mu)}
button{font:700 14px Poppins,sans-serif;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;background:var(--g);color:#231c00;transition:.2s}
button:hover{filter:brightness(1.1);box-shadow:0 0 18px #ffe60066}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:#ff5d73;color:#fff}
.err{color:#ff8a9a;font-size:13px;min-height:18px}.ok{color:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--g);color:#231c00}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pass{color:var(--ok)}.fail{color:#ff8a9a}
/* ===== responsif: HP, tablet, laptop ===== */
html{-webkit-text-size-adjust:100%}
.card{overflow-x:auto}
@media(min-width:1400px){.wrap{max-width:1280px}}
/* layar ujian: memenuhi layar apa pun, ukuran huruf menyesuaikan perangkat */
#test{position:fixed;inset:0;background:#050a14;z-index:9;overflow:hidden}
.stage{width:100%;height:100%;display:flex;flex-direction:column;gap:.5em;background:linear-gradient(160deg,#0e1b36,#0a1224);
 padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
 font-size:clamp(14px,calc(10px + .45vw + .45vh),22px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.6em;flex-wrap:wrap}
.bar b{flex:1 1 11em;min-width:0;font-size:.95em;font-weight:700}
.tm{font:800 1.5em Poppins;color:var(--g);text-shadow:0 0 12px #ffe60088}
.qa{flex:1;min-height:0;overflow:auto;padding:.4em 0;-webkit-overflow-scrolling:touch}
.qt{font-size:1.1em;font-weight:400;line-height:1.55;margin-bottom:.8em;white-space:pre-wrap}
.op{display:flex;gap:.8em;align-items:center;width:100%;text-align:left;margin:.45em 0;padding:.7em .9em;background:#101d38;color:var(--tx);border:1px solid var(--ln);font-weight:300;font-size:1em;line-height:1.4}
.op i{font:800 normal 1.05em Poppins;color:var(--g);min-width:1.4em}
.op.sel{background:#2b2a12;border-color:var(--sl);box-shadow:0 0 14px var(--sl),inset 0 0 12px #ffffff33;color:var(--sl)}.op.sel i{color:var(--sl)}
.nv{display:flex;gap:.7em;flex-wrap:wrap;max-height:32%;overflow:auto}
.grp{flex:1;min-width:30%;border:1px solid var(--ln);border-radius:10px;padding:.4em .6em;background:#0c1730}
.grp small{color:var(--g);font-weight:700;font-size:.8em}.grp div{display:flex;flex-wrap:wrap;gap:.25em}
.nv button{padding:0;width:2.3em;height:1.9em;font-size:.8em;background:#14264a;color:var(--tx);border-radius:6px;font-weight:400}
.nv button.dn{background:#3a3300;color:var(--g)}.nv button.cur{outline:2px solid var(--sl)}
.ft{display:flex;justify-content:space-between;gap:.6em}.ft button{min-width:7em}
.big{font:800 40px Poppins;color:var(--g);text-shadow:0 0 20px #ffe60088}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin:.6em 0}.res>div{background:#0c1730;border:1px solid var(--ln);border-radius:12px;padding:.7em;text-align:center}
/* gambar soal */
.qt img{display:block;max-width:100%;max-height:40vh;margin:.6em 0;border-radius:8px;background:#fff;object-fit:contain}
.op img,.card img{max-width:100%;max-height:18vh;border-radius:6px;background:#fff;vertical-align:middle}
/* tabel soal */
.tw{display:block;max-width:100%;overflow-x:auto;margin:.6em 0;white-space:normal}
table.qtb{width:auto;max-width:100%;border-collapse:collapse;font-size:inherit;font-weight:400;background:#0c1730;border:1px solid var(--ln);border-radius:8px}
.qtb th,.qtb td{border:1px solid var(--ln);padding:.4em .8em;text-align:center;font-weight:400;white-space:nowrap;line-height:1.3}
.qtb th{background:#14264a;color:var(--g);font-weight:700;text-align:left}
.card .tw{margin:6px 0}.card .qtb th,.card .qtb td{padding:5px 10px}
/* layar pendek (HP mendatar): seluruh halaman ujian bisa digulir */
@media(max-height:520px){
 .stage{overflow-y:auto;-webkit-overflow-scrolling:touch}
 .qa{flex:none;overflow:visible}
 .nv{max-height:none;overflow:visible}
 .bar{position:sticky;top:0;z-index:2;background:#0e1b36;padding:.3em 0}
}
/* laptop dengan layar tidak terlalu tinggi: tombol nomor lebih ringkas */
@media(min-width:701px) and (max-height:820px){.nv button{width:2em;height:1.55em}.nv{max-height:28%}}
.cover img{aspect-ratio:auto;object-fit:contain;max-height:62vh;border:0;box-shadow:none;background:none;filter:drop-shadow(0 0 24px #ffe60033)}
/* HP / layar sempit */
@media(max-width:700px){
 body{font-size:14px}
 .wrap{padding:14px}
 .card{padding:14px;border-radius:14px}
 input,select{font-size:16px}
 button{padding:10px 14px}
 .top h2{font-size:18px}
 .tabs{gap:6px}.tabs button{padding:9px 12px;font-size:13px}
 table{font-size:12px}td,th{padding:8px 6px}
 .cover{min-height:auto;padding-top:10px}
 .grp{min-width:100%}.nv{max-height:34%}
 .big{font-size:30px}.res .big{font-size:26px!important}
 .res{gap:.4em}.res>div{padding:.5em .3em}
 .ft button{flex:1}
}

/* ===== LAYAR UJIAN: HP (tegak) & tablet kecil – satu kolom, nomor soal satu baris yang bisa digeser ===== */
@media(max-width:899px){
 .bar{flex-wrap:nowrap}
 .bar b{flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85em}
 .tm{font-size:1.25em}
 .bar button{padding:9px 14px;flex:0 0 auto}
 .qt img{max-height:30vh}
 .op{padding:.85em .9em}
 .ft button{flex:1;padding:12px 14px}
 .nv{max-height:none;overflow:visible;flex-wrap:nowrap}
 .grp{min-width:0;flex:1 1 100%}
 .grp div{position:relative;flex-wrap:nowrap;overflow-x:auto;padding-bottom:.35em;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
 .nv button{flex:0 0 auto;width:2.6em;height:2.2em;font-size:.85em}
}
/* ===== LAYAR UJIAN: LAPTOP / KOMPUTER – nomor soal di panel kanan, soal & pilihan memakai lebar layar ===== */
@media(min-width:900px) and (min-height:521px){
 .stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,20vw,340px);grid-template-rows:auto minmax(0,1fr) auto;gap:.7em 1.2em;font-size:clamp(15px,calc(9px + .38vw + .38vh),20px)}
 .bar{grid-column:1/-1}
 .qa{grid-column:1;grid-row:2;min-height:0}
 .ft{grid-column:1;grid-row:3;justify-content:space-between}
 .ft button{min-width:9em;padding:12px 22px}
 .nv{grid-column:2;grid-row:2/4;max-height:none;overflow:auto;align-content:start;flex-direction:column;flex-wrap:nowrap}
 .grp{min-width:0;flex:none;padding:.6em .7em}
 .grp div{gap:.4em}
 .nv button{width:2.6em;height:2.2em;font-size:.9em}
 .qt img{max-height:55vh}
 .op img{max-height:22vh}
 /* layar lebar: soal di kiri, pilihan jawaban di kanan */
 @media(min-width:1150px){
  .qa.qq{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.6em;overflow:hidden;padding:0}
  .qa.qq>.qt,.qa.qq>.ops{min-height:0;overflow:auto;padding:.4em .6em .4em 0;margin:0}
  .qa.qq>.ops{padding-right:.2em}
  .qa.qq .op:first-child{margin-top:0}
 }
}
</style></head><body>

/* teks + gambar + tabel:
   [[img:data:...]] -> <img>;  [[tbl:...]] -> tabel;  baris "a | b | c" berurutan -> tabel */
const IMG_RE=/\s*\[\[img:(data:image\/[a-z+.-]+;base64,[A-Za-z0-9+\/=]+)\]\]\s*/g;
const TBL_RE=/\s*\[\[tbl:([^\]]*)\]\]\s*/g;
const PIPE_RE=/^[^|\n]+(?:\s\|\s[^|\n]+)+$/;
const tblHtml=rows=>'<div class="tw"><table class="qtb">'+rows.map(r=>'<tr>'+r.map((c,j)=>j===0?'<th>'+esc(c)+'</th>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
const plain=s=>esc(s).replace(IMG_RE,(m,src)=>'<img src="'+src+'" alt="gambar soal">');
function textBlock(s){
 let out='',buf=[],rows=[];
 const fT=()=>{if(rows.length){out+=tblHtml(rows);rows=[]}},fB=()=>{if(buf.length){out+=plain(buf.join('\n'));buf=[]}};
 s.split('\n').forEach(l=>{if(PIPE_RE.test(l.trim())){fB();rows.push(l.trim().split(/\s\|\s/).map(x=>x.trim()))}else{fT();buf.push(l)}});
 fT();fB();return out}
function rich(s){s=String(s??'');let out='',last=0,m;TBL_RE.lastIndex=0;
 while((m=TBL_RE.exec(s))){out+=textBlock(s.slice(last,m.index));
  let rows=[];try{rows=JSON.parse(decodeURIComponent(m[1]))}catch(e){}
  out+=tblHtml(rows);last=TBL_RE.lastIndex}
 return out+textBlock(s.slice(last))}

async function upXl(inp){const f=inp.files[0];inp.value='';if(!f)return;if(!window.XLSX)return err('Pustaka Excel belum termuat. Muat ulang halaman.');
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let out=[],skip=0;
  wb.SheetNames.forEach(n=>{if(/^petunjuk$/i.test(n))return;XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).forEach(r=>{const c=r.map(x=>String(x).trim());if(!c[0]&&!c[1])return;
   if(!(+c[2]>=1&&+c[2]<=6)||/^contoh/i.test(c[1])){skip++;return}
   out.push([c[0],c[1],c[2],c.slice(3).filter(x=>x).join(',')].join('\t'))})});
  if(!out.length)return err('Tidak ada baris siswa yang terbaca. Pastikan memakai template: NIS, Nama, Kelas (1-6), Password.');
  $('#bulk').value=out.join('\n');err(out.length+' siswa terbaca dari file'+(skip?' ('+skip+' baris judul/contoh dilewati)':'')+'. Periksa daftarnya, lalu klik "Simpan siswa".')}
 catch(e){err('Gagal membaca file: '+e.message)}}

 if(!rows.length)return err('Tidak ada baris yang valid. Format: NIS, Nama, Kelas, Password.');
 if(rows.some(r=>!(r.kelas>=1&&r.kelas<=6)||r.pw.length<4))return err('Kelas harus 1-6 dan password minimal 4 karakter.');

/* perkecil gambar yang terlalu besar (>350 KB) supaya muat di database */
function shrink(src){return new Promise(res=>{
 if(src.length<350000)return res(src);
 const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src})}

/* upload Word: convertToHtml membawa gambar dan tabel -> teks bertoken -> parse() */
async function up(t,f){if(!f)return;
 try{
  const buf=await f.arrayBuffer();
  const r=await mammoth.convertToHtml({arrayBuffer:buf},{convertImage:mammoth.images.imgElement(async img=>{
    const b64=await img.read('base64');return{src:await shrink('data:'+img.contentType+';base64,'+b64)}})});
  const d=document.createElement('div');d.innerHTML=r.value;
  /* tabel Word -> satu token berisi seluruh baris dan kolom (tidak terpecah per sel) */
  d.querySelectorAll('table').forEach(tb=>{
    const rows=[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim())).filter(r=>r.some(Boolean));
    tb.replaceWith('\n[[tbl:'+encodeURIComponent(JSON.stringify(rows))+']]\n')});
  d.querySelectorAll('img').forEach(i=>i.replaceWith('\n[[img:'+i.getAttribute('src')+']]\n'));
  d.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  d.querySelectorAll('p,li,h1,h2,h3,h4,tr').forEach(p=>p.append('\n'));
  const p=parse(d.textContent,t);
  const ni=p.q.filter(q=>q.q.includes('[[img:')||Object.values(q.o).some(o=>o.includes('[[img:'))).length;
  const nt=p.q.filter(q=>q.q.includes('[[tbl:')||/(^|\n)[^|\n]+(\s\|\s[^|\n]+)+(\n|$)/.test(q.q)).length;
  if(ni)p.warn.push('Terbaca '+ni+' soal bergambar.');
  if(nt)p.warn.push('Terbaca '+nt+' soal bertabel.');
  pend[t]=p;
 }catch(e){console.error(e);pend[t]={q:[],warn:['Gagal membaca file Word: '+e.message]}}
 admin()}
function parse(txt,t){const qs=[];let c=null,last=null;
 const pts=s=>{let m=s.match(/^(.*?)\s*[\[(]\s*(?:skor|poin|nilai)?\s*[:=]?\s*([1-5])\s*(?:poin|pts?)?\s*[\])]\s*$/i);return m?[m[1],+m[2]]:[s,null]};
 txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{let m;
  if(c&&(m=l.match(/^(?:kunci(?:\s*jawaban)?|jawaban)\s*[:=]\s*\(?([A-Ea-e])\)?(?![A-Za-z])[\s.,:;\-–]*(.*)/i))){c.k=m[1].toUpperCase();c.e=(m[2]||'').trim();return last='e'}
  if(c&&(m=l.match(/^(?:skor|poin|nilai)[^:=]*[:=]\s*(.+)/i))){const p={};[...m[1].matchAll(/([A-Ea-e])\s*[=:\-–]\s*([1-5])/g)].forEach(x=>p[x[1].toUpperCase()]=+x[2]);if(Object.keys(p).length)return Object.assign(c.p,p)}
  if(c&&(m=l.match(/^pembahasan\s*[:=]?\s*(.*)/i))){c.e=m[1];return last='e'}
  if(m=l.match(/^\(?([A-Ea-e])[.)]\s*(.*)/)){if(!c)return;const[x,p]=pts(m[2]),L=m[1].toUpperCase();c.o[L]=x;if(p)c.p[L]=p;return last=L}
  if(m=l.match(/^(\d{1,3})\s*[.)]\s+(.*)/)){c={q:m[2],o:{},k:'',p:{},e:''};qs.push(c);return last='q'}
  if(c){if(last==='q')c.q+='\n'+l;else if(last==='e')c.e+=' '+l;else if(last)c.o[last]+=' '+l}});
 const w=[];if(!qs.length)w.push('Tidak ada soal terbaca.');const nk=qs.filter(q=>!q.k).length;if(nk)w.push(nk+' soal tanpa kunci.');const no=qs.filter(q=>Object.keys(q.o).length<2).length;if(no)w.push(no+' soal opsinya kurang dari 2.');
 return{q:qs,warn:w}}

 if(error)return err(error.message);delete pend.x;admin()}
